name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
        working-directory: LeitorDeProjetosV2
      - name: Build executable
        run: npm run build
        working-directory: LeitorDeProjetosV2
      - name: Upload artifact
        uses: actions/upload-artifact@v3
        with:
          name: LeitorDeProjetos.exe
          path: LeitorDeProjetosV2/dist/*.exe
