name: Publicar executável

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-e-release:
    runs-on: windows-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v6

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Instalar PyInstaller
        run: python -m pip install --disable-pip-version-check pyinstaller

      - name: Gerar executável
        shell: pwsh
        run: |
          $versao = "${{ github.ref_name }}".TrimStart("v")
          python -m PyInstaller `
            --clean `
            --noconfirm `
            --onefile `
            --windowed `
            --name "LeitorDeProjetos-$versao" `
            LeitorDeProjetos/main.py

      - name: Publicar na página de Releases
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $versao = "${{ github.ref_name }}".TrimStart("v")
          gh release create "${{ github.ref_name }}" `
            "dist/LeitorDeProjetos-$versao.exe" `
            --title "Leitor de Projetos $versao" `
            --generate-notes
